name: Generate iOS P12

on:
  workflow_dispatch:

jobs:
  generate-p12:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate P12 from certificate
        run: |
          # Decodificar el certificado .cer
          echo "${{ secrets.IOS_CERT_BASE64 }}" | base64 -d > distribution.cer
          
          # Decodificar la clave privada
          echo "${{ secrets.IOS_KEY_BASE64 }}" | base64 -d > ios_key.key
          
          # Convertir .cer a .pem
          openssl x509 -in distribution.cer -inform DER -out distribution.pem
          
          # Crear keychain temporal
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Importar clave privada al keychain
          openssl pkcs12 -export \
            -in distribution.pem \
            -inkey ios_key.key \
            -out temp.p12 \
            -passout pass:temp123
          
          security import temp.p12 -k build.keychain -P temp123 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp123" build.keychain
          
          # Exportar desde keychain como P12 compatible con Apple
          CERT_SHA=$(security find-certificate -a -Z build.keychain | grep "SHA-1" | head -1 | awk '{print $3}')
          echo "Certificate SHA: $CERT_SHA"
          
          security export -k build.keychain -t identities -f pkcs12 -P EgosIOS2026 -o distribution_macos.p12
          
          echo "P12 generado"
          security pkcs12 -in distribution_macos.p12 -passin pass:EgosIOS2026 -noout 2>/dev/null || openssl pkcs12 -in distribution_macos.p12 -passin pass:EgosIOS2026 -noout && echo "P12 VÁLIDO ✅"

      - name: Upload P12
        uses: actions/upload-artifact@v4
        with:
          name: ios-distribution-p12
          path: distribution_macos.p12
          retention-days: 1
