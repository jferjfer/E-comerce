name: Generate iOS P12

on:
  workflow_dispatch:

jobs:
  generate-p12:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate P12 from certificate
        run: |
          # Decodificar el certificado .cer
          echo "${{ secrets.IOS_CERT_BASE64 }}" | base64 -d > distribution.cer
          
          # Decodificar la clave privada
          echo "${{ secrets.IOS_KEY_BASE64 }}" | base64 -d > ios_key.key
          
          # Verificar que la clave y el certificado coinciden
          CERT_MOD=$(openssl x509 -in distribution.cer -inform DER -noout -modulus | md5)
          KEY_MOD=$(openssl rsa -in ios_key.key -noout -modulus | md5)
          echo "Cert modulus: $CERT_MOD"
          echo "Key modulus:  $KEY_MOD"
          
          if [ "$CERT_MOD" != "$KEY_MOD" ]; then
            echo "ERROR: La clave privada no coincide con el certificado"
            exit 1
          fi
          
          echo "Clave y certificado coinciden ✅"
          
          # Convertir .cer a .pem
          openssl x509 -in distribution.cer -inform DER -out distribution.pem
          
          # Generar P12
          openssl pkcs12 -export \
            -in distribution.pem \
            -inkey ios_key.key \
            -out distribution_macos.p12 \
            -passout pass:EgosIOS2026
          
          openssl pkcs12 -in distribution_macos.p12 -passin pass:EgosIOS2026 -noout && echo "P12 VÁLIDO ✅"

      - name: Upload P12
        uses: actions/upload-artifact@v4
        with:
          name: ios-distribution-p12
          path: distribution_macos.p12
          retention-days: 1
